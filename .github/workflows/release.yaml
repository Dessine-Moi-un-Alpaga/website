name: Release
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - beta
    - main
concurrency:
  group: ${{ github.workflow }}
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: 25
      NODE_VERSION: 25
      SEMANTIC_RELEASE_VERSION: 25
      TERRAFORM_VERSION: 1.17.2
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:

    - name: Check out source code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
        fetch-tags: true

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        cache: npm
        cache-dependency-path: firebase-emulator
        node-version: ${{ env.NODE_VERSION }}

    - name: Set up Gradle integration
      uses: ./.github/actions/setup-gradle
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install Task
      uses: go-task/setup-task@v2

    - name: Set up Firebase emulator cache
      uses: actions/cache@v6
      with:
        key: firebase-tools-${{ hashFiles('firebase-emulator/package-lock.json') }}
        path: ~/.cache/firebase/emulators

    - name: Build
      run: task app:build

    - name: Save build reports and logs
      background: true
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: reports-and-logs
        path: |
          app/build/reports/**/configuration-cache-report.html
          app/build/reports/problems/problems-report.html
          firebase-emulator/*.log

    - name: Deploy API documentation
      background: true
      continue-on-error: true
      uses: ./.github/actions/api-docs
      with:
        path: build/dokka/html

    - name: Perform SonarCloud Analysis
      background: true
      uses: ./.github/actions/sonar
      with:
        commit: ${{ github.sha }}
        os: ${{ runner.os }}
        previous-commit: ${{ github.event.before }}
        ref-name: ${{ github.ref_name}}
        token: ${{ secrets.SONARCLOUD_TOKEN }}

    - name: Set Up Terraform
      uses: ./.github/actions/setup-terraform
      with:
        cache-directory: ${{ github.workspace }}/.terraform.d/plugin-cache
        os: ${{ runner.os }}
        version: ${{ env.TERRAFORM_VERSION }}

    - name: Install Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Install semantic-release exec plugin
      run: npm install --save-dev @semantic-release/exec

    - name: Expose GitHub Runtime
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])
          core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        export_environment_variables: true
        service_account: terraform@${{ vars.GOOGLE_PROJECT }}.iam.gserviceaccount.com
        workload_identity_provider: projects/${{ vars.GOOGLE_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-workflows/providers/github-actions

    - name: Release
      env:
        API_KEY_HASH: ${{ secrets.API_KEY_HASH }}
        ARTIFACT_REGISTRY_LOCATION: ${{ vars.ARTIFACT_REGISTRY_LOCATION }}
        ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
        BUCKET_NAME: ${{ vars.BUCKET_NAME }}
        CREATE_DOMAIN_MAPPING: ${{ vars.CREATE_DOMAIN_MAPPING }}
        CREDENTIALS: ${{ secrets.CREDENTIALS }}
        CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        FIRESTORE_LOCATION: ${{ vars.FIRESTORE_LOCATION }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOOGLE_PROJECT: ${{ vars.GOOGLE_PROJECT }}
        GOOGLE_REGION: ${{ vars.GOOGLE_REGION }}
        SMTP_SERVER_ADDRESS: ${{ vars.SMTP_SERVER_ADDRESS }}
        SMTP_SERVER_PASSWORD: ${{ secrets.SMTP_SERVER_PASSWORD }}
        SMTP_SERVER_PORT: ${{ vars.SMTP_SERVER_PORT }}
        SMTP_SERVER_USERNAME: ${{ vars.SMTP_SERVER_USERNAME }}
        TF_IN_AUTOMATION: true
      run: npx semantic-release@${SEMANTIC_RELEASE_VERSION}

permissions:
  contents: write
  id-token: write
  issues: write
  pages: write
  pull-requests: write
