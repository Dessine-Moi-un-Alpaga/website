name: sonar
description: Performs Sonarcloud Analysis
inputs:
  commit:
    description: The commit to consider
    required: true
  os:
    description: The runner OS
    required: true
  previous-commit:
    description: The previous commit to consider
    required: true
  ref-name:
    description: The branch name
    required: true
  token:
    description: The SonarCloud token
    required: true
runs:
  using: composite
  steps:
  - name: Check if analysis is required
    id: analysis-check
    shell: bash
    run: |
      if ${{ inputs.ref-name == 'main' }}
      then
        echo "analysis-required=true" >> $GITHUB_OUTPUT
      else
        if git diff --name-only ${{ inputs.previous-commit }} ${{ inputs.commit }} | grep -E '^(app/src/main/kotlin/|app/src/main/resources/static/assets/css/|app/src/main/resources/static/assets/js/|infrastructure/app/.*\.tf)'
        then
          echo "analysis-required=true" >> $GITHUB_OUTPUT
        else
          echo "analysis-required=false" >> $GITHUB_OUTPUT
        fi
      fi
  - name: Set up SonarCloud package cache
    if: steps.analysis-check.outputs.analysis-required == 'true'
    uses: actions/cache@v6
    with:
      key: ${{ inputs.os }}-sonar
      path: ~/.sonar/cache

  - name: Analyze
    if: steps.analysis-check.outputs.analysis-required == 'true'
    uses: SonarSource/sonarqube-scan-action@v8
    env:
      SONAR_TOKEN: ${{ inputs.token }}
